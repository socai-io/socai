[package]
name = "socai-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio = { workspace = true }
futures.workspace = true
async-tungstenite.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
reqwest.workspace = true
base64.workspace = true
dirs = "5"
libc.workspace = true
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# Image compositing/resizing for batching note images into 2x2 vision grids.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Local OCR engine (PP-OCRv6 small via ONNX Runtime). Default features pull a
# prebuilt ONNX Runtime at build time (download-binaries) + SIMD CPU kernels.
# The per-platform hardware execution providers (CoreML on macOS, DirectML on
# Windows) are compiled in via the target blocks below so they can be selected
# at runtime with SOCAI_OCR_EP; the default runtime EP is CPU.
oar-ocr = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
oar-ocr = { version = "0.7", features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
oar-ocr = { version = "0.7", features = ["directml"] }

[dev-dependencies]
tracing-subscriber.workspace = true
tempfile = "3"

[lints]
workspace = true
