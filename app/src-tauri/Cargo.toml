[package]
name = "socai_app"
version = "0.5.5"
description = "socai desktop app"
edition = "2021"

[lib]
name = "socai_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2.10.1"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
flate2 = "1"
reqwest.workspace = true
futures.workspace = true
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
libc.workspace = true
same-file = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
url = "2"
tokio = { workspace = true }
anyhow.workspace = true
async-trait.workspace = true
cap-std = "4"
tempfile = "3"
dirs = "5"
dunce = "1"
calamine = "0.36.1"
quick-xml = "0.41"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
socai-core.workspace = true

# macOS-only: attach an empty unified toolbar so AppKit centers the native
# traffic lights on a 52px titlebar itself (see install_unified_titlebar in
# lib.rs). tao's built-in trafficLightPosition inset runs inside its content-
# view drawRect, which wry replaces, so it never fires for Tauri windows.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSToolbar", "NSResponder"] }
